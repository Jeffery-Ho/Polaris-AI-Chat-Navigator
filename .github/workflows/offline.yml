name: Offline acceptance
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  acceptance:
    name: Polaris offline acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
      - uses: browser-actions/setup-geckodriver@v1
      - uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest
      - name: Install desktop test tools
        run: sudo apt-get update -qq && sudo apt-get install -y xdotool
      - name: Locate Microsoft Edge
        run: |
          if ! command -v microsoft-edge >/dev/null; then
            curl --fail --silent --show-error --location https://go.microsoft.com/fwlink/?linkid=2149051 -o "$RUNNER_TEMP/edge.deb"
            sudo apt-get install -y "$RUNNER_TEMP/edge.deb"
          fi
          echo "POLARIS_EDGE_PATH=$(command -v microsoft-edge)" >> "$GITHUB_ENV"
      - name: Run candidate acceptance
        id: qa
        env:
          GTK_USE_PORTAL: "0"
          LANG: C.UTF-8
          POLARIS_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: xvfb-run -a pnpm test:release
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-report
          path: |
            Release/qa/run-*/**
            !Release/qa/run-*/unpacked/**
            !Release/qa/run-*/assets/**
          if-no-files-found: error
      - name: Save tested candidates
        uses: actions/upload-artifact@v4
        with:
          name: tested-candidates
          path: ${{ steps.qa.outputs.output }}/assets/
          if-no-files-found: error
