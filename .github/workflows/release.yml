name: Build extension release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extension-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check source
        run: pnpm check

      - name: Build extension
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Validate build metadata
        id: metadata
        run: node scripts/validate-extension-package.js

      - name: Package release assets
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          BUILD: ${{ steps.metadata.outputs.build }}
        run: |
          mkdir -p release
          archive="Polaris-AI-${VERSION}-build-${BUILD}.zip"
          stable_archive="release/Polaris-AI.zip"
          (cd dist && zip -qr "../release/${archive}" . -x '*.DS_Store')
          cp "release/${archive}" "$stable_archive"
          unzip -Z1 "release/${archive}" | grep -qx 'manifest.json'
          unzip -Z1 "$stable_archive" | grep -qx 'manifest.json'

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
          BUILD: ${{ steps.metadata.outputs.build }}
          TAG: v${{ steps.metadata.outputs.version }}-build.${{ steps.metadata.outputs.build }}
        run: |
          archive="release/Polaris-AI-${VERSION}-build-${BUILD}.zip"
          stable_archive="release/Polaris-AI.zip"
          latest_url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/Polaris-AI.zip"
          verification_dir="$(mktemp -d)"
          download_check="$verification_dir/latest.zip"
          trap 'rm -rf "$verification_dir"' EXIT

          verify_archive() {
            local archive_path="$1"
            local manifest_path

            unzip -t "$archive_path" >/dev/null
            unzip -Z1 "$archive_path" | grep -qx 'manifest.json'
            manifest_path="$(mktemp "$verification_dir/manifest.XXXXXX")"
            unzip -p "$archive_path" manifest.json > "$manifest_path"
            EXPECTED_VERSION="$VERSION" EXPECTED_VERSION_NAME="${VERSION}(${BUILD})" \
              node - "$manifest_path" <<'NODE'
          const fs = require("node:fs");

          const [manifestPath] = process.argv.slice(2);
          const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
          if (manifest.version !== process.env.EXPECTED_VERSION) {
            throw new Error(`Unexpected manifest version: ${manifest.version}`);
          }
          if (manifest.version_name !== process.env.EXPECTED_VERSION_NAME) {
            throw new Error(`Unexpected manifest version_name: ${manifest.version_name}`);
          }
          NODE
            rm -f "$manifest_path"
          }

          archive_fingerprint() {
            local archive_path="$1"

            unzip -Z1 "$archive_path" \
              | sed '/\/$/d' \
              | LC_ALL=C sort \
              | while IFS= read -r entry; do
                  printf '%s\0' "$entry"
                  unzip -p "$archive_path" "$entry" | sha256sum
                done \
              | sha256sum \
              | awk '{print $1}'
          }

          verify_latest_release() {
            curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 2 --max-time 30 \
              "$latest_url" \
              -o "$download_check"
            verify_archive "$download_check"
            if [[ "$(archive_fingerprint "$stable_archive")" != "$(archive_fingerprint "$download_check")" ]]; then
              echo "::error::Latest download does not match the validated stable asset."
              exit 1
            fi
          }

          download_release_assets() {
            gh release download "$TAG" \
              --pattern "${archive##*/}" \
              --pattern "Polaris-AI.zip" \
              --dir "$verification_dir" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
            verify_archive "$verification_dir/${archive##*/}"
            verify_archive "$verification_dir/Polaris-AI.zip"
            if [[ "$(archive_fingerprint "$verification_dir/${archive##*/}")" != "$(archive_fingerprint "$verification_dir/Polaris-AI.zip")" ]]; then
              echo "::error::Versioned and stable Release assets differ."
              exit 1
            fi
          }

          verify_archive "$archive"
          verify_archive "$stable_archive"
          cmp --silent "$archive" "$stable_archive"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_is_draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [[ "$release_is_draft" != "true" ]]; then
              download_release_assets
              if [[ "$(archive_fingerprint "$stable_archive")" != "$(archive_fingerprint "$verification_dir/Polaris-AI.zip")" ]]; then
                echo "::error::Release $TAG is already published with different assets; increment the version or build before publishing again."
                exit 1
              fi
              verify_latest_release
              echo "Release $TAG is already published with matching assets; nothing to update."
              exit 0
            fi
          else
            gh release create "$TAG" \
              --draft \
              --title "Polaris AI ${VERSION} build ${BUILD}" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi

          gh release upload "$TAG" "$archive" "$stable_archive" --clobber --repo "$GITHUB_REPOSITORY"
          download_release_assets

          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
          verify_latest_release
