<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 96 86" width="96" height="86">
<!-- Geometry, pearl stops and sparkle schedule from Recap's ProfileAbsoluteStarBadge. -->
<style>
.particle{animation:flight 2.8s cubic-bezier(.333333,.666667,.666667,1) infinite;animation-delay:var(--delay)}
.sparkle{animation:glimmer 2.8s linear infinite;animation-delay:var(--delay)}
@keyframes flight{from{transform:translate(var(--start-x),var(--start-y))}to{transform:translate(var(--end-x),var(--end-y))}}
@keyframes glimmer{0%{opacity:0;transform:scale(1.1)}25%{opacity:.7071}50%{opacity:1}75%{opacity:.7071}100%{opacity:0;transform:scale(.6)}}
@media(prefers-reduced-motion:reduce){.particle{animation:none;transform:translate(var(--rest-x),var(--rest-y))}.sparkle{animation:none;opacity:.85;transform:scale(.8)}}
</style>
